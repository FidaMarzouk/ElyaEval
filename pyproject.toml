[project]
name = "elyaeval"
version = "0.1.3"
description = "Starter kit for DeepEval-based CI/CD testing: standard dataset, metric presets, and a pytest-file generator."
requires-python = ">=3.10"
dependencies = [
    "deepeval==4.0",
    "pytest>=7.0",
]

[project.scripts]
elyaeval = "elyaeval.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["elyaeval*"]

[tool.setuptools.package-data]
elyaeval = ["templates/*.tmpl", "standard_dataset/*.jsonl"]
