[project]
name = "elyaeval"
version = "0.2.0"
description = "Starter kit for DeepEval-based CI/CD testing: standard dataset, metric presets, and a pytest-file generator."
requires-python = ">=3.10"
dependencies = [
    "deepeval==4.0",
    "pytest>=7.0",
]

[project.scripts]
elyaeval = "elyaeval.cli:main"

# Auto-registers elyaeval/plugin.py as a pytest plugin for any environment
# that has this package installed . This is what makes HTML reports + per-metric averages
# appear automatically at the end of `pytest`/`deepeval test run`, for
# every generated test file, just by bumping the elyaeval version pin.
[project.entry-points.pytest11]
elyaeval = "elyaeval.plugin"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["elyaeval*"]

[tool.setuptools.package-data]
elyaeval = ["templates/*.tmpl", "standard_dataset/*.jsonl"]
