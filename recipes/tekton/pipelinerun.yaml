# Manually create one of these to trigger a run — no Triggers/EventListener
# involved, per the "manual for now" decision.
#
# Every value below is specific to THIS run against THIS SUT — the recipe
# itself (tasks.yaml / pipeline.yaml) has no SUT-specific or provider-
# specific values in it. Swap what's here for a different SUT or judge
# model without touching the recipe.
#
# rag-demo + Ollama both run HOST-SIDE (not deployed into the kind
# cluster). On Docker Desktop, host.docker.internal resolves from inside
# kind's pods back to the host — set these three before applying:
#
#   $env:SUT_URL = "http://host.docker.internal:8000"
#   $env:JUDGE_MODEL_NAME = "llama3.1"
#   $env:JUDGE_BASE_URL = "http://host.docker.internal:11434/v1"
#   envsubst < pipelinerun.yaml | kubectl create -n elyaeval-ci -f -
#
# (If you're not on Docker Desktop — e.g. plain Linux kind — host.docker.internal
# may not resolve; use the kind bridge gateway IP instead:
#   docker network inspect kind -f '{{(index .IPAM.Config 0).Gateway}}'
# and substitute that for host.docker.internal above.)
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: elyaeval-rag-recipe-run-
spec:
  pipelineRef:
    name: elyaeval-rag-recipe
  params:
    - name: repo-url
      value: https://github.com/FidaMarzouk/RagDemo.git
    - name: revision
      value: dev
    - name: sut-url
      value: ${SUT_URL}

    # Judge model — Ollama, running host-side, same host.docker.internal
    # reachability as sut-url above. judge-api-key-secret-* stay fixed:
    # Ollama doesn't validate the key, so the Secret just needs to exist
    # with any placeholder value (see secrets.yaml).
    - name: judge-model-name
      value: ${JUDGE_MODEL_NAME}
    - name: judge-model-base-url
      value: ${JUDGE_BASE_URL}
    - name: judge-api-key-secret-name
      value: judge-model-credentials
    - name: judge-api-key-secret-key
      value: api-key

    - name: results-repo-url
      value: https://github.com/FidaMarzouk/RagDemo.git
    - name: results-branch
      value: ci-results
    - name: results-secret-name
      value: git-write-credentials
    - name: results-secret-key
      value: token
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi