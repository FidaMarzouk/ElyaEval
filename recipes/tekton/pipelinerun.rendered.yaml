# Manually create one of these to trigger a run — no Triggers/EventListener
# involved, per the "manual for now" decision.
#

apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: elyaeval-rag-recipe-run-
spec:
  pipelineRef:
    name: elyaeval-rag-recipe
  params:
      - name: repo-url
        value: https://github.com/FidaMarzouk/RagDemo.git
      - name: revision
        value: dev
      - name: sut-url
        value: http://host.docker.internal:8000
      - name: judge-model-name
        value: llama3.1
      - name: judge-base-url
        value: http://host.docker.internal:11434/v1
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
