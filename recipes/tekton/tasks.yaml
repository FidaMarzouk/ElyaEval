---
# fetch-source: clone the repo containing the generated elyaeval test suite.
# Nothing app-specific here — this is identical for any SUT using the recipe.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: fetch-source
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git:2.45.2
      script: |
        #!/bin/sh
        set -eu
        git clone --branch "$(params.revision)" --depth 1 \
          "$(params.repo-url)" "$(workspaces.source.path)/repo"

---
# setup-env: install exactly what the elyaeval template needs to run,
# caching everything in the workspace so run-suite can reuse it without
# reinstalling. Deliberately NOT installing anything from the SUT's own
# requirements.txt (no psycopg2, no llama_index, no groq client, ...) —
# the test process only ever talks to RAG_APP_URL over HTTP, so it doesn't
# need the SUT's dependencies at all.
#
# elyaeval-package-spec defaults to the framework's own current pinned
# release — that default is legitimately framework-owned (every recipe
# instance installs the same template code), not SUT-specific, but it's
# still a param so a newer tag doesn't require editing this file.
#
# pip install --target puts all packages in workspace/.python-packages,
# persisted across tasks via the shared workspace volume. run-suite sets
# PYTHONPATH to reuse these cached packages without network calls or
# reimplementation.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: setup-env
spec:
  params:
    - name: elyaeval-package-spec
      type: string
      default: "git+https://github.com/FidaMarzouk/ElyaEval.git@v0.1.2"
      description: pip-installable spec for the elyaeval package (git+https://... or a plain version pin)
  workspaces:
    - name: source
  steps:
    - name: install-deps
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        
        # Install system packages needed for pip (git for git+https:// URLs)
        apt-get update && apt-get install -y git
        
        # Install Python deps to workspace/.python-packages
        # --target installs to a directory that becomes part of PYTHONPATH in run-suite
        mkdir -p "$(workspaces.source.path)/.python-packages"
        pip install --no-cache-dir \
          --target "$(workspaces.source.path)/.python-packages" \
          "$(params.elyaeval-package-spec)" \
          pytest \
          deepeval \
          requests
        
        echo "✓ Dependencies installed to .python-packages"

---
# run-suite: the actual test entrypoint. sut-url and the judge-model-*
# params are the ONLY things this Task knows about a given run — nothing
# here is specific to any one SUT's stack or any one team's judge-model
# provider. Change judge-model-* per PipelineRun, not per Task edit.
# No pip installs here — reuses packages cached by setup-env via PYTHONPATH.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-suite
spec:
  params:
    - name: sut-url
      type: string
      description: Base URL of the SUT's /query endpoint, reachable from inside this cluster
    - name: judge-model-name
      type: string
      description: "Model identifier for DeepEval's judge, e.g. openai/gpt-oss-120b or llama3.1"
    - name: judge-model-base-url
      type: string
      description: "OpenAI-compatible base URL for the judge model, e.g. https://api.groq.com/openai/v1 or http://localhost:11434/v1"
    - name: judge-model-format
      type: string
      default: json
      description: LOCAL_MODEL_FORMAT value DeepEval expects for this provider
    - name: judge-api-key-secret-name
      type: string
      default: judge-model-credentials
      description: Name of the Secret holding the judge model's API key
    - name: judge-api-key-secret-key
      type: string
      default: api-key
      description: Key within that Secret holding the judge model's API key
  workspaces:
    - name: source
  steps:
    - name: run-pytest
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)/repo
      env:
        - name: RAG_APP_URL
          value: $(params.sut-url)
        - name: PYTHONPATH
          value: $(workspaces.source.path)/.python-packages
        - name: DEEPEVAL_DISABLE_DOTENV
          value: "1"
        - name: USE_LOCAL_MODEL
          value: "True"
        - name: LOCAL_MODEL_NAME
          value: $(params.judge-model-name)
        - name: LOCAL_MODEL_BASE_URL
          value: $(params.judge-model-base-url)
        - name: LOCAL_MODEL_FORMAT
          value: $(params.judge-model-format)
        - name: LOCAL_MODEL_API_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.judge-api-key-secret-name)
              key: $(params.judge-api-key-secret-key)
      script: |
        #!/bin/sh
        set -eu
        
        mkdir -p "$(workspaces.source.path)/report"
        mkdir -p "$(workspaces.source.path)/report/deepeval_results"
        
        # DEEPEVAL_RESULTS_FOLDER: structured JSON per run — score, reason,
        # and cost per metric per test case. junit.xml (below) can only
        # ever carry pass/fail; this is what actually captures the "clearer
        # output" deepeval prints to the terminal locally. Works alongside
        # assert_test()-based gating, no need to switch to evaluate().
        export DEEPEVAL_RESULTS_FOLDER="$(workspaces.source.path)/report/deepeval_results"
        
        # || true so a test-content failure (assertion) still lets us reach
        # check-results and publish-results with the report intact —
        # check-results is what actually fails the PipelineRun.
        python -m pytest test_elyaeval_rag_qa.py \
          --junitxml="$(workspaces.source.path)/report/junit.xml" \
          -q || true

---
# check-results: gate on the JUnit output — pass/fail only, which is all
# this needs to enforce a hard gate. Score/reason/cost detail lives in
# report/deepeval_results/*.json (from DEEPEVAL_RESULTS_FOLDER in
# run-suite) — see publish-results for that side of it. A future
# cost-budget Task would parse that JSON instead of adding logic here.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: check-results
spec:
  workspaces:
    - name: source
  steps:
    - name: check-junit
      image: python:3.11-slim
      script: |
        #!/bin/sh
        set -eu
        python - <<'EOF'
        import sys
        import xml.etree.ElementTree as ET

        path = "$(workspaces.source.path)/report/junit.xml"
        root = ET.parse(path).getroot()
        suite = root if root.tag == "testsuite" else root.find("testsuite")
        failures = int(suite.get("failures", 0))
        errors = int(suite.get("errors", 0))
        total = int(suite.get("tests", 0))
        print(f"{total} tests, {failures} failures, {errors} errors")
        if failures or errors:
            sys.exit(1)
        EOF

---
# publish-results: commits the JUnit report + structured DeepEval JSON to
# a dedicated results branch in the repo, under ci-reports/<run-name>/.
# Self-hosted, versioned, diffable across runs — no external storage system.
#
# The Secret name/key are params, not fixed — a team can point this at
# whatever Secret already holds their write token without editing the Task.
#
# Falls back to creating an orphan branch on first run (when
# results-branch doesn't exist yet).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: publish-results
spec:
  params:
    - name: results-repo-url
      type: string
      description: HTTPS repo URL (no credentials) to commit results into, e.g. https://github.com/org/repo.git
    - name: results-branch
      type: string
      default: ci-results
    - name: results-secret-name
      type: string
      default: git-write-credentials
      description: Name of the Secret holding a repo-write token
    - name: results-secret-key
      type: string
      default: token
      description: Key within that Secret holding the token
  workspaces:
    - name: source
  steps:
    - name: commit-report
      image: alpine/git:2.45.2
      env:
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.results-secret-name)
              key: $(params.results-secret-key)
      script: |
        #!/bin/sh
        set -eu

        AUTH_URL=$(echo "$(params.results-repo-url)" | sed "s#https://#https://x-access-token:${GIT_TOKEN}@#")
        WORKDIR=/tmp/results-repo
        RUN_DIR="ci-reports/$(context.taskRun.name)"

        # Clone the results branch if it exists; otherwise start an orphan branch
        if git clone --branch "$(params.results-branch)" --depth 1 "$AUTH_URL" "$WORKDIR" 2>/dev/null; then
          echo "Cloned existing $(params.results-branch) branch"
        else
          echo "$(params.results-branch) doesn't exist yet — creating it"
          git clone --depth 1 "$AUTH_URL" "$WORKDIR"
          cd "$WORKDIR"
          git checkout --orphan "$(params.results-branch)"
          git rm -rf . > /dev/null 2>&1 || true
          cd -
        fi

        mkdir -p "$WORKDIR/$RUN_DIR"
        cp "$(workspaces.source.path)/report/junit.xml" "$WORKDIR/$RUN_DIR/junit.xml"
        # Structured score/reason/cost detail — the part junit.xml can't carry
        cp -r "$(workspaces.source.path)/report/deepeval_results/." "$WORKDIR/$RUN_DIR/" 2>/dev/null || true

        cd "$WORKDIR"
        git config user.email "ci-bot@elyaeval.local"
        git config user.name "elyaeval-ci-bot"
        git add "$RUN_DIR"
        git commit -m "CI results: $(context.taskRun.name)"
        git push origin "$(params.results-branch)"

        echo "Published to $(params.results-repo-url) @ $(params.results-branch)/$RUN_DIR"