---
# fetch-source: clone the repo containing the generated elyaeval test suite.
# Nothing app-specific here — this is identical for any SUT using the recipe.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: fetch-source
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
      # no default — pipeline.yaml is the single source of truth (default: dev)
      # and always passes it explicitly. Standalone TaskRuns must supply it too.
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git:2.45.2
      script: |
        #!/bin/sh
        set -eu
        git clone --branch "$(params.revision)" --depth 1 \
          "$(params.repo-url)" "$(workspaces.source.path)/repo"

---
# setup-env: install exactly what the elyaeval template needs to run,
# caching everything in the workspace so run-suite can reuse it without
# reinstalling. Deliberately NOT installing anything from the SUT's own
# requirements.txt (no psycopg2, no llama_index, no groq client, ...) —
# the test process only ever talks to the SUT over HTTP, so it doesn't
# need the SUT's dependencies at all.
#
# pip install --target puts all packages in workspace/.python-packages,
# persisted across tasks via the shared workspace volume. run-suite sets
# PYTHONPATH to reuse these cached packages without network calls or
# reimplementation.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: setup-env
spec:
  params:
    - name: elyaeval-package-spec
      type: string
      description: >-
        pip-installable spec for the elyaeval package (git+https://... or a
        plain version pin). No default here — pipeline.yaml owns the one
        legitimate hardcoded default for this recipe; keeping it out of this
        Task means there's only one place to bump the framework version.
    - name: sut-requirements-file
      type: string
      default: ""
      description: >-
        OPT-IN escape hatch, empty by default. Path (relative to the repo
        root) of a requirements file to additionally install — ONLY needed
        for component-level test files that import the SUT's own modules
        directly (e.g. test_elyaeval_*_component.py reaching into
        rag_core.py/retriever.py) instead of talking to the SUT over HTTP.
        End-to-end (HTTP-only) PipelineRuns must leave this empty — setup-env
        stays SUT-agnostic for them, exactly as before. Prefer a binary wheel
        package (e.g. psycopg2-binary, not psycopg2) in that requirements
        file so this step doesn't also need build tooling (gcc/libpq-dev).
  workspaces:
    - name: source
  steps:
    - name: install-deps
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu

        # Install system packages needed for pip (git for git+https:// URLs)
        apt-get update && apt-get install -y git

        # Install Python deps to workspace/.python-packages
        # --target installs to a directory that becomes part of PYTHONPATH in run-suite
        mkdir -p "$(workspaces.source.path)/.python-packages"
        pip install --no-cache-dir \
          --target "$(workspaces.source.path)/.python-packages" \
          "$(params.elyaeval-package-spec)" \
          pytest \
          deepeval \
          requests

        echo "✓ Dependencies installed to .python-packages"

        # --- Opt-in SUT deps (component-level tests only) -----------------
        # Only runs when a PipelineRun explicitly sets sut-requirements-file.
        # Every existing HTTP-only PipelineRun leaves this empty and hits
        # none of the code below — behavior for them is unchanged.
        SUT_REQS="$(params.sut-requirements-file)"
        if [ -n "$SUT_REQS" ]; then
          REQ_PATH="$(workspaces.source.path)/repo/$SUT_REQS"
          if [ ! -f "$REQ_PATH" ]; then
            echo "sut-requirements-file set to '$SUT_REQS' but $REQ_PATH not found" >&2
            exit 1
          fi
          pip install --no-cache-dir \
            --target "$(workspaces.source.path)/.python-packages" \
            -r "$REQ_PATH"
          echo "✓ SUT requirements installed from $SUT_REQS"
        fi

---
# run-suite: the actual test entrypoint. sut-url, test-file, and the
# judge-* params are the ONLY things this Task knows about a given run —
# nothing here is specific to any one SUT's stack, any one task type, or
# (as of this version) any one judge-model provider. Change per
# PipelineRun, not per Task edit — that includes adding new task types
# (agentic, classifier, ...) or new judge providers later.
#
# JUDGE PROVIDER WIRING
# ----------------------
# Different DeepEval providers need DIFFERENT sets of env vars, not just
# different values — an OpenAI-compatible local server (Ollama, vLLM,
# LM Studio, Groq's OpenAI-compat endpoint) needs USE_LOCAL_MODEL +
# LOCAL_MODEL_BASE_URL + LOCAL_MODEL_FORMAT; Anthropic needs
# USE_ANTHROPIC_MODEL + ANTHROPIC_MODEL_NAME + ANTHROPIC_API_KEY; OpenAI
# just needs OPENAI_MODEL_NAME + OPENAI_API_KEY. Because of that, this
# Task does NOT declare provider-specific env vars in the static `env:`
# block below (a secretKeyRef pointing at a key that doesn't apply to the
# chosen provider would fail the pod at scheduling, not at test time).
# Instead it declares exactly ONE generic secret-sourced var (JUDGE_API_KEY)
# that always exists, and the `run-pytest` script below branches on
# judge-provider to export the correct provider-specific vars from it
# before pytest runs.
#
# judge-api-key-secret-name/key are reused across all providers (same
# Secret, same mechanism) — only its *contents* need to be a real key for
# anthropic/openai; for local/Ollama the Secret still needs to exist, but
# Ollama doesn't validate the value, so a placeholder is fine there.
#
# No pip installs here — reuses packages cached by setup-env via PYTHONPATH.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-suite
spec:
  params:
    - name: sut-url
      type: string
      description: Base URL of the SUT's endpoint under test, reachable from inside this cluster
    - name: test-file
      type: string
      description: >-
        Path (relative to the repo root) of the generated elyaeval test
        file to run, e.g. test_elyaeval_rag_qa.py or
        test_elyaeval_agentic_action.py — whatever `elyaeval init
        --task-type ...` produced for this repo. Not defaulted here on
        purpose: which file to run is a per-repo, per-task-type decision,
        not something this shared Task should assume.
    - name: judge-provider
      type: string
      description: >-
        Which DeepEval judge-model provider to configure: "local"
        (OpenAI-compatible server — Ollama, vLLM, LM Studio, Groq's
        OpenAI-compat endpoint), "anthropic", or "openai". Determines
        which env vars run-pytest exports below — see the Task-level
        comment above. No default here — pipeline.yaml owns it.
    - name: judge-model-name
      type: string
      description: >-
        Model identifier for DeepEval's judge. Meaning depends on
        judge-provider: an OpenAI-compat model/tag for "local" (e.g.
        llama3.1, openai/gpt-oss-120b), an Anthropic model for
        "anthropic" (e.g. claude-sonnet-4-6), or an OpenAI model for
        "openai" (e.g. gpt-4.1).
    - name: judge-model-base-url
      type: string
      description: >-
        OpenAI-compatible base URL for the judge model. ONLY consulted
        when judge-provider is "local" (e.g. https://api.groq.com/openai/v1
        or http://localhost:11434/v1) — ignored for "anthropic"/"openai",
        which talk to their providers' fixed APIs directly. Safe to leave
        empty for those.
    - name: judge-model-format
      type: string
      description: >-
        LOCAL_MODEL_FORMAT value DeepEval expects for this provider. ONLY
        consulted when judge-provider is "local" — ignored otherwise.
      # no default — pipeline.yaml owns it (default: json)
    - name: judge-api-key-secret-name
      type: string
      description: Name of the Secret holding the judge model's API key
      # no default — pipeline.yaml owns it (default: judge-model-credentials)
    - name: judge-api-key-secret-key
      type: string
      description: Key within that Secret holding the judge model's API key
      # no default — pipeline.yaml owns it (default: api-key)
    - name: sut-env-secret-name
      type: string
      default: sut-env-unset
      description: >-
        OPT-IN escape hatch, mirrors sut-requirements-file's philosophy in
        setup-env. Name of a Secret whose keys get injected as env vars
        into the SUT's OWN code (e.g. GROQ_API_KEY, OPENAI_API_KEY) —
        ONLY needed for component-level test files that import the SUT
        in-process and therefore construct the SUT's own API clients at
        import/runtime. Left at its default (a Secret name that never
        exists) for e2e/HTTP-only PipelineRuns — the envFrom/optional:true
        below makes a missing Secret a silent no-op, not a pod failure.
        Deliberately a whole-Secret passthrough (not a single named var)
        so this Task never needs to know which env var names any given
        SUT happens to require — new SUTs/providers need zero edits here.
  workspaces:
    - name: source
  steps:
    - name: run-pytest
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)/repo
      envFrom:
        # Whole-Secret passthrough for SUT-side env vars — see param
        # description above. optional:true means the default (a Secret
        # name that doesn't exist) is a no-op, so e2e/HTTP-only
        # PipelineRuns are completely unaffected.
        - secretRef:
            name: $(params.sut-env-secret-name)
            optional: true
      env:
        # APP_URL: base URL of the SUT, passed through from params.sut-url.
        # Read via os.environ["APP_URL"] inside your own run_app()
        # implementation (see TODO 2 in the generated test file) — this
        # Task has no way to reach your SUT itself, it only forwards the
        # URL into the pytest process's environment.
        - name: APP_URL
          value: $(params.sut-url)
        - name: PYTHONPATH
          value: $(workspaces.source.path)/.python-packages
        - name: DEEPEVAL_DISABLE_DOTENV
          value: "1"
        # JUDGE_API_KEY: the one provider-agnostic secret-sourced value.
        # The script below re-exports it under the correct provider-specific
        # env var name (LOCAL_MODEL_API_KEY / ANTHROPIC_API_KEY /
        # OPENAI_API_KEY) based on judge-provider — nothing provider-specific
        # is declared statically here.
        - name: JUDGE_API_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.judge-api-key-secret-name)
              key: $(params.judge-api-key-secret-key)
      script: |
        #!/bin/sh
        set -eu

        # --- Judge provider wiring -----------------------------------
        # Exactly one of these branches runs, exporting only the env vars
        # that provider actually needs. See the Task-level comment above
        # for why this can't live in the static env: block.
        case "$(params.judge-provider)" in
          local)
            export USE_LOCAL_MODEL=True
            export LOCAL_MODEL_NAME="$(params.judge-model-name)"
            export LOCAL_MODEL_BASE_URL="$(params.judge-model-base-url)"
            export LOCAL_MODEL_FORMAT="$(params.judge-model-format)"
            export LOCAL_MODEL_API_KEY="$JUDGE_API_KEY"
            ;;
          anthropic)
            export USE_ANTHROPIC_MODEL=1
            export ANTHROPIC_MODEL_NAME="$(params.judge-model-name)"
            export ANTHROPIC_API_KEY="$JUDGE_API_KEY"
            ;;
          openai)
            export OPENAI_MODEL_NAME="$(params.judge-model-name)"
            export OPENAI_API_KEY="$JUDGE_API_KEY"
            ;;
          *)
            echo "Unknown judge-provider '$(params.judge-provider)' — expected local, anthropic, or openai" >&2
            exit 1
            ;;
        esac

        mkdir -p "$(workspaces.source.path)/report"
        mkdir -p "$(workspaces.source.path)/report/deepeval_results"

        # DEEPEVAL_RESULTS_FOLDER: structured JSON per run — score, reason,
        # and cost per metric per test case. junit.xml (below) can only
        # ever carry pass/fail; this is what actually captures the "clearer
        # output" deepeval prints to the terminal locally.
        export DEEPEVAL_RESULTS_FOLDER="$(workspaces.source.path)/report/deepeval_results"

        # || true so a test-content failure (assertion) still lets us reach
        # check-results and publish-results with the report intact —
        # check-results is what actually fails the PipelineRun.
        python -m pytest "$(params.test-file)" \
          --junitxml="$(workspaces.source.path)/report/junit.xml" \
          -s -q || true
        cp report/results_*.csv "$(workspaces.source.path)/report/" 2>/dev/null || true
        # elyaeval's pytest plugin (auto-registered once elyaeval is installed,
        # see pyproject.toml's [project.entry-points.pytest11]) writes an HTML
        # sibling next to each results_*.csv at session end — same basename,
        # .html extension. Copy those over the same way so report-results has
        # something to upload alongside the CSV.
        cp report/results_*.html "$(workspaces.source.path)/report/" 2>/dev/null || true

---
# check-results: gate on the JUnit output — pass/fail only, which is all
# this needs to enforce a hard gate.
# A future cost-budget Task would parse that JSON instead of adding logic here.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: check-results
spec:
  workspaces:
    - name: source
  steps:
    - name: check-junit
      image: python:3.11-slim
      script: |
        #!/bin/sh
        set -eu
        python - <<'EOF'
        import sys
        import xml.etree.ElementTree as ET

        path = "$(workspaces.source.path)/report/junit.xml"
        root = ET.parse(path).getroot()
        suite = root if root.tag == "testsuite" else root.find("testsuite")
        failures = int(suite.get("failures", 0))
        errors = int(suite.get("errors", 0))
        total = int(suite.get("tests", 0))
        print(f"{total} tests, {failures} failures, {errors} errors")
        if failures or errors:
            sys.exit(1)
        EOF
      

---
# report-results: uploads the run's CSV report to an Azure Blob Storage
# container (Azurite locally, a real Storage Account in higher envs — the
# az CLI and connection-string mechanism are identical either way).
# One upload per run, under a unique run-id filename.
# "Current state" is just whichever blob is newest.

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: report-results
spec:
  params:
    - name: blob-container
      type: string
      description: "Container name to upload results into, e.g. project-x"
    - name: blob-connection-string-secret-name
      type: string
      description: Name of the Secret holding the Azure Storage connection string
      # no default — pipeline.yaml owns it (default: blob-storage-credentials)
    - name: blob-connection-string-secret-key
      type: string
      description: Key within that Secret holding the connection string
    - name: run-id
      type: string
      description: "Unique identifier for this run, used as the uploaded blob name"
  workspaces:
    - name: source
  steps:
    - name: upload-report
      image: mcr.microsoft.com/azure-cli:2.65.0
      env:
        # az storage blob upload picks this up automatically — no --connection-string
        # flag needed. Works unchanged against Azurite (dev) or a real Storage
        # Account (prod): only the connection string's contents change.
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: $(params.blob-connection-string-secret-name)
              key: $(params.blob-connection-string-secret-key)
      script: |
        #!/bin/sh
        set -eu

        RUN_ID="$(params.run-id)"

        # results_<task_type>.csv, and this Task runs for every task type
        # (rag_qa, retrieval, summarization, qa_correctness, ...), so the
        # filename varies per run-suite invocation. Pick up whatever
        # results_*.csv actually landed in report/ instead of hardcoding
        # one task type's name.
        #
        # A single run-suite invocation can also legitimately produce MORE
        # than one CSV — e.g. elyaeval/DeepEval writes a separate
        # results_<task_type>_component.csv alongside results_<task_type>.csv
        # So this uploads every results_*.csv found, one blob each.
        
        CSV_COUNT=$(find "$(workspaces.source.path)/report" -maxdepth 1 -name 'results_*.csv' 2>/dev/null | wc -l)

        if [ "$CSV_COUNT" -eq 0 ]; then
          echo "No results_*.csv found under $(workspaces.source.path)/report — skipping upload"
        else
          find "$(workspaces.source.path)/report" -maxdepth 1 -name 'results_*.csv' | while IFS= read -r CSV; do
            BASENAME=$(basename "$CSV" .csv)
            SUFFIX=${BASENAME#results_}
            BLOB_NAME="${RUN_ID}_${SUFFIX}.csv"
            az storage blob upload \
              --container-name "$(params.blob-container)" \
              --file "$CSV" \
              --name "$BLOB_NAME" \
              --overwrite
            echo "✓ Uploaded $CSV to container $(params.blob-container) as $BLOB_NAME"

            # elyaeval's pytest plugin writes an HTML sibling next to every
            # results_*.csv it wrote (same basename, .html instead of .csv)
            # — see elyaeval/plugin.py + run-suite's cp step above. Upload
            # it under the SAME blob-name convention as the CSV (just
            # .html instead of .csv) so the two are always easy to pair up
            # in the container by name. Older CSVs from before this
            # feature existed simply have no HTML sibling — silently
            # skipped, no upload attempted, no error.
            HTML="$(dirname "$CSV")/${BASENAME}.html"
            if [ -f "$HTML" ]; then
              HTML_BLOB_NAME="${RUN_ID}_${SUFFIX}.html"
              az storage blob upload \
                --container-name "$(params.blob-container)" \
                --file "$HTML" \
                --name "$HTML_BLOB_NAME" \
                --overwrite
              echo "✓ Uploaded $HTML to container $(params.blob-container) as $HTML_BLOB_NAME"
            fi
          done
        fi

---
# check-regression: the ACROSS-RUNS gate — separate from check-results,
# which only gates a single run's metrics against their fixed thresholds.
# This gates a run's per-metric averages against a BASELINE from a
# previous run, so a change that still clears every metric's threshold
# but scores meaningfully worse than before still fails the pipeline.
#
# Self-gating by design, no separate "enable this feature" switch needed:
# the baseline blob (baseline_<task-type>.csv, one per test-file "shape" —
# see STABLE_NAME below) simply doesn't exist until something explicitly
# promotes one via promote-baseline=true. Until then, every run just logs
# "no baseline yet" and passes — existing PipelineRuns that don't set
# promote-baseline are completely unaffected by adding this Task. Once a
# baseline exists, every subsequent run compares against it automatically.
#
# FIVE STEPS, DELIBERATELY SEQUENTIAL (not independent, unlike
# check-results/report-results in the finally block):
#   download-baseline -> compare -> upload-regression-report ->
#   check-regression-status -> promote-baseline
#
# compare DELIBERATELY NEVER FAILS ITSELF (unlike an earlier version of
# this Task) — it only writes a marker file recording whether anything
# regressed. The actual gate is check-regression-status, its own step,
# AFTER upload-regression-report. Splitting it this way is what makes the
# regression HTML report get uploaded even on a run that's about to fail
# this gate — the one case you most want to see it for. If compare failed
# the Task directly, Tekton would skip every step after it, including the
# upload, and a real regression's report would be generated on the pod and
# then simply discarded when it tore down.
#
# check-regression-status failing (and ONLY that step failing) is what
# stops promote-baseline from running — Tekton skips remaining steps in a
# Task once an earlier one fails, so a regressed run never reaches
# promote-baseline regardless of that param's value. No extra conditional
# logic needed for that guarantee, it falls out of normal step-failure
# semantics — same as before, just moved one step later so upload happens
# first.
#
# STABLE_NAME: baseline blob names strip BOTH the results_ prefix and the
# trailing _<UTC timestamp> (format YYYYMMDDTHHMMSSZ, fixed-width, matches
# new_report_path() in report.py) from the candidate CSV's filename, e.g.
# results_rag_qa_component_20260828T083251Z.csv -> rag_qa_component. That's
# the part that's stable run-to-run for the SAME test-file/task-type, which
# is what makes "baseline_rag_qa_component.csv" a meaningful blob to keep
# comparing against and overwriting, rather than a one-off per run like the
# timestamped blobs report-results uploads. The regression HTML report
# itself, by contrast, gets a run-specific blob name
# (<run-id>_regression_<stable>.html, mirroring report-results' own
# <run-id>_<suffix> convention) since its content is specific to this one
# comparison, not something later runs should overwrite.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: check-regression
spec:
  params:
    - name: blob-container
      type: string
      description: "Container name to read/write baseline blobs in — same container report-results uploads run blobs to."
    - name: blob-connection-string-secret-name
      type: string
      description: Name of the Secret holding the Azure Storage connection string
    - name: blob-connection-string-secret-key
      type: string
      description: Key within that Secret holding the connection string
    - name: run-id
      type: string
      description: "Unique name for this PipelineRun (used to name the uploaded regression-report blob) — pass $(context.pipelineRun.name)."
    - name: regression-tolerance
      type: string
      default: "0.02"
      description: >-
        Absolute avg-score drop (0..1 scale, same units as a metric's
        score/threshold) that counts as a regression. Passed straight to
        `elyaeval compare --tolerance`.
    - name: promote-baseline
      type: string
      default: "false"
      description: >-
        "true" to overwrite baseline_<task-type>.csv with THIS run's CSV
        once comparison passes (or when no baseline exists yet, to
        bootstrap one) — "false" (default) leaves the existing baseline
        untouched regardless of outcome. Set "true" deliberately for runs
        you want to become the new known-good state (e.g. a main-branch
        run), not for every PR run — otherwise a PR could silently move
        the baseline other PRs compare against.
  workspaces:
    - name: source
  steps:
    - name: download-baseline
      image: mcr.microsoft.com/azure-cli:2.65.0
      env:
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: $(params.blob-connection-string-secret-name)
              key: $(params.blob-connection-string-secret-key)
      script: |
        #!/bin/sh
        set -eu

        for CSV in "$(workspaces.source.path)"/report/results_*.csv; do
          [ -e "$CSV" ] || continue
          BASENAME=$(basename "$CSV" .csv)
          SUFFIX=${BASENAME#results_}
          STABLE_NAME=$(echo "$SUFFIX" | sed -E 's/_[0-9]{8}T[0-9]{6}Z$//')
          BASELINE_BLOB="baseline_${STABLE_NAME}.csv"
          BASELINE_FILE="$(workspaces.source.path)/report/${BASELINE_BLOB}"

          if az storage blob download \
               --container-name "$(params.blob-container)" \
               --name "$BASELINE_BLOB" \
               --file "$BASELINE_FILE" \
               --only-show-errors >/dev/null 2>&1; then
            echo "✓ Downloaded $BASELINE_BLOB for comparison against $CSV"
          else
            echo "ℹ No baseline blob '$BASELINE_BLOB' yet — $STABLE_NAME will skip regression comparison this run"
          fi
        done

    - name: compare
      image: python:3.11-slim
      env:
        - name: PYTHONPATH
          value: $(workspaces.source.path)/.python-packages
      script: |
        #!/bin/sh
        set -eu

        # Deliberately never `exit 1` from THIS step — see the Task-level
        # comment above for why. Any regression found gets recorded in
        # this marker file instead; the actual gate is
        # check-regression-status, after the upload step has already run.
        MARKER="$(workspaces.source.path)/report/.regression_failed"
        rm -f "$MARKER"

        for CSV in "$(workspaces.source.path)"/report/results_*.csv; do
          [ -e "$CSV" ] || continue
          python - "$CSV" "$(workspaces.source.path)/report" "$(params.regression-tolerance)" <<'PYEOF' || echo "1" >> "$MARKER"
        import os
        import re
        import sys

        csv_path, report_dir, tolerance = sys.argv[1], sys.argv[2], sys.argv[3]
        basename = os.path.basename(csv_path)
        stem = basename[:-4] if basename.endswith(".csv") else basename
        suffix = stem[len("results_"):] if stem.startswith("results_") else stem
        stable = re.sub(r"_\d{8}T\d{6}Z$", "", suffix)

        baseline_path = os.path.join(report_dir, f"baseline_{stable}.csv")
        if not os.path.exists(baseline_path):
            print(f"ℹ No baseline for {stable} — skipping regression check")
            sys.exit(0)

        # component CSVs have a span_name column the e2e ones don't —
        # group by span_name+metric_name for those so the same metric name
        # scored on two different spans isn't blended into one comparison.
        group_by = "span_name,metric_name" if "component" in stable else "metric_name"
        html_path = os.path.join(report_dir, f"regression_{stable}.html")

        # Call elyaeval's compare() function directly, in-process, rather
        # than shelling out to an `elyaeval` command via subprocess. The
        # `elyaeval` CONSOLE SCRIPT (the wrapper executable pip normally
        # installs alongside a package) is never on PATH here — this step
        # only sets PYTHONPATH, which makes `import elyaeval` work but does
        # nothing for shell command lookup. subprocess.run(["elyaeval", ...])
        # failed with FileNotFoundError for exactly that reason: it isn't
        # a python/import problem, it's that there's no such executable to
        # find. Importing and calling the function directly sidesteps this
        # entirely — no dependency on how the package happened to be
        # installed, no PATH to get right.
        from elyaeval.cli import compare as elyaeval_compare

        exit_code = elyaeval_compare(
            baseline_path,
            csv_path,
            tolerance=float(tolerance),
            group_by=group_by,
            html_path=html_path,
        )
        sys.exit(exit_code)
        PYEOF
        done

        if [ -s "$MARKER" ]; then
          echo "✗ Regression detected against baseline — will fail this Task after uploading the report"
        else
          echo "✓ No regressions against baseline (or no baseline existed yet to compare against)"
        fi

    - name: upload-regression-report
      image: mcr.microsoft.com/azure-cli:2.65.0
      env:
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: $(params.blob-connection-string-secret-name)
              key: $(params.blob-connection-string-secret-key)
      script: |
        #!/bin/sh
        set -eu

        # Runs UNCONDITIONALLY — regardless of what `compare` found —
        # since this step comes before the gate below. This is the fix:
        # the comparison report for a run that's ABOUT to fail this gate
        # still gets uploaded, instead of being generated on the pod and
        # thrown away the moment it tears down.
        RUN_ID="$(params.run-id)"
        FOUND=0
        for HTML in "$(workspaces.source.path)"/report/regression_*.html; do
          [ -e "$HTML" ] || continue
          FOUND=1
          BLOB_NAME="${RUN_ID}_$(basename "$HTML")"
          az storage blob upload \
            --container-name "$(params.blob-container)" \
            --file "$HTML" \
            --name "$BLOB_NAME" \
            --overwrite \
            --only-show-errors
          echo "✓ Uploaded $HTML to container $(params.blob-container) as $BLOB_NAME"
        done
        if [ "$FOUND" -eq 0 ]; then
          echo "ℹ No regression_*.html files this run (no baseline existed yet to compare against) — nothing to upload"
        fi

    - name: check-regression-status
      image: python:3.11-slim
      script: |
        #!/bin/sh
        set -eu

        # The actual gate — deliberately its own step, AFTER the upload
        # above, so a failure here (which stops promote-baseline from
        # running, same as before) never stops the report upload from
        # having already happened.
        MARKER="$(workspaces.source.path)/report/.regression_failed"
        if [ -s "$MARKER" ]; then
          echo "✗ Regression detected against baseline — failing this Task"
          exit 1
        fi
        echo "✓ Nothing regressed — proceeding"

    - name: promote-baseline
      image: mcr.microsoft.com/azure-cli:2.65.0
      env:
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: $(params.blob-connection-string-secret-name)
              key: $(params.blob-connection-string-secret-key)
      script: |
        #!/bin/sh
        set -eu

        # This step only ever runs if check-regression-status above exited
        # 0 — Tekton skips remaining steps in a Task once an earlier one
        # fails, so a regressed run never reaches here regardless of this
        # param's value.
        if [ "$(params.promote-baseline)" != "true" ]; then
          echo "promote-baseline is not 'true' — leaving existing baseline(s) unchanged"
          exit 0
        fi

        for CSV in "$(workspaces.source.path)"/report/results_*.csv; do
          [ -e "$CSV" ] || continue
          BASENAME=$(basename "$CSV" .csv)
          SUFFIX=${BASENAME#results_}
          STABLE_NAME=$(echo "$SUFFIX" | sed -E 's/_[0-9]{8}T[0-9]{6}Z$//')
          BASELINE_BLOB="baseline_${STABLE_NAME}.csv"

          az storage blob upload \
            --container-name "$(params.blob-container)" \
            --file "$CSV" \
            --name "$BASELINE_BLOB" \
            --overwrite \
            --only-show-errors
          echo "✓ Promoted $CSV to baseline as $BASELINE_BLOB"
        done