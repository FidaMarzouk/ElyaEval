apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: elyaeval-rag-recipe
spec:
  params:
    - name: repo-url
      type: string
      description: Repo containing the generated elyaeval test suite
    - name: revision
      type: string
      default: dev
    - name: elyaeval-package-spec
      type: string
      default: "git+https://github.com/FidaMarzouk/ElyaEval.git@eval"
      description: >-
        pip-installable spec for the elyaeval framework itself (not the SUT).
        This is the one deliberately hardcoded default in the whole recipe —
        every project runs the same framework code, so it's pinned centrally
        here and ONLY here. Override per-run if you need to test against a
        different framework tag/branch.
    - name: sut-url
      type: string
      description: Base URL of the SUT's /query endpoint, reachable from inside the cluster
    - name: test-file
      type: string
      default: test_elyaeval_rag_qa.py
      description: >-
        Path (relative to the repo root) of the generated elyaeval test
        file to run — output of `elyaeval init --task-type ...` in the SUT
        repo. Defaults to the rag_qa filename since that's the only task
        type currently wired into this recipe; pass a different value here
        once other task types (agentic, classifier, ...) get their own
        PipelineRuns — no change needed elsewhere in this recipe.
    - name: judge-provider
      type: string
      default: local
      description: >-
        Which DeepEval judge-model provider to use: "local"
        (OpenAI-compatible server — Ollama, vLLM, LM Studio, Groq's
        OpenAI-compat endpoint), "anthropic", or "openai". Defaults to
        "local" so every existing PipelineRun that doesn't set this keeps
        behaving exactly as before. See run-suite's Task-level comment in
        tasks.yaml for what env vars each option wires up.
    - name: judge-model-name
      type: string
      description: >-
        Model identifier for DeepEval's judge — meaning depends on
        judge-provider (e.g. llama3.1 / openai/gpt-oss-120b for "local",
        claude-sonnet-4-6 for "anthropic", gpt-4.1 for "openai").
    - name: judge-model-base-url
      type: string
      default: ""
      description: >-
        OpenAI-compatible base URL for the judge model. ONLY required when
        judge-provider is "local" — leave empty for "anthropic"/"openai".
    - name: judge-model-format
      type: string
      default: json
      description: >-
        LOCAL_MODEL_FORMAT value DeepEval expects. ONLY consulted when
        judge-provider is "local".
    - name: judge-api-key-secret-name
      type: string
      default: judge-model-credentials
      description: >-
        Name of the Secret holding the judge model's API key. Same Secret
        mechanism is reused across all providers — for "anthropic"/"openai"
        it must hold a real key; for "local" against Ollama it just needs
        to exist (Ollama doesn't validate the value).
    - name: judge-api-key-secret-key
      type: string
      default: api-key
    - name: blob-container
      type: string
      description: "Container name for this SUT/project, e.g. project-x — one per SUT/team for access isolation"
    - name: blob-connection-string-secret-name
      type: string
      default: blob-storage-credentials
      description: >-
        Name of the Secret holding the Azure Storage connection string.
        Same Secret mechanism/shape works for Azurite (local dev) and a
        real Storage Account — only the Secret's *contents* change.
    - name: blob-connection-string-secret-key
      type: string
      default: connection-string
  workspaces:
    - name: source
  tasks:
    - name: fetch-source
      taskRef:
        name: fetch-source
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source

    - name: setup-env
      runAfter: [fetch-source]
      taskRef:
        name: setup-env
      params:
        - name: elyaeval-package-spec
          value: $(params.elyaeval-package-spec)
      workspaces:
        - name: source
          workspace: source

    - name: run-suite
      runAfter: [setup-env]
      taskRef:
        name: run-suite
      params:
        - name: sut-url
          value: $(params.sut-url)
        - name: test-file
          value: $(params.test-file)
        - name: judge-provider
          value: $(params.judge-provider)
        - name: judge-model-name
          value: $(params.judge-model-name)
        - name: judge-model-base-url
          value: $(params.judge-model-base-url)
        - name: judge-model-format
          value: $(params.judge-model-format)
        - name: judge-api-key-secret-name
          value: $(params.judge-api-key-secret-name)
        - name: judge-api-key-secret-key
          value: $(params.judge-api-key-secret-key)
      workspaces:
        - name: source
          workspace: source

  finally:
      #
      # NOTE: finally tasks run independently of each other (no implicit
      # ordering between check-results and report-results below). That's
      # intentional here — report-results only reads report files that
      # check-results doesn't touch 
      - name: check-results
        taskRef:
          name: check-results
        workspaces:
          - name: source
            workspace: source
      - name: report-results
        taskRef:
          name: report-results
        params:
          - name: blob-container
            value: $(params.blob-container)
          - name: blob-connection-string-secret-name
            value: $(params.blob-connection-string-secret-name)
          - name: blob-connection-string-secret-key
            value: $(params.blob-connection-string-secret-key)
          - name: run-id
            value: $(context.pipelineRun.name)
        workspaces:
          - name: source
            workspace: source