apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: elyaeval-rag-recipe
spec:
  params:
    - name: repo-url
      type: string
      description: Repo containing the generated elyaeval test suite
    - name: revision
      type: string
      default: dev
    - name: elyaeval-package-spec
      type: string
      default: "git+https://github.com/FidaMarzouk/ElyaEval.git@eval"
      description: >-
        pip-installable spec for the elyaeval framework itself (not the SUT).
        This is the one deliberately hardcoded default in the whole recipe —
        every project runs the same framework code, so it's pinned centrally
        here and ONLY here. Override per-run if you need to test against a
        different framework tag/branch.
    - name: sut-url
      type: string
      description: Base URL of the SUT's /query endpoint, reachable from inside the cluster
    - name: test-file
      type: string
      default: test_elyaeval_rag_qa.py
      description: >-
        Path (relative to the repo root) of the generated elyaeval test
        file to run — output of `elyaeval init --task-type ...` in the SUT
        repo. Defaults to the rag_qa filename since that's the only task
        type currently wired into this recipe; pass a different value here
        once other task types (agentic, classifier, ...) get their own
        PipelineRuns — no change needed elsewhere in this recipe.
    - name: judge-model-name
      type: string
      description: "Model identifier for DeepEval's judge, e.g. openai/gpt-oss-120b or llama3.1"
    - name: judge-model-base-url
      type: string
      description: "OpenAI-compatible base URL for the judge model"
    - name: judge-model-format
      type: string
      default: json
    - name: judge-api-key-secret-name
      type: string
      default: judge-model-credentials
    - name: judge-api-key-secret-key
      type: string
      default: api-key
    - name: results-repo-url
      type: string
      description: HTTPS repo URL (no credentials) to commit CI results into
    - name: results-branch
      type: string
      default: ci-results
    - name: results-secret-name
      type: string
      default: git-write-credentials
    - name: results-secret-key
      type: string
      default: token
  workspaces:
    - name: source
  tasks:
    - name: fetch-source
      taskRef:
        name: fetch-source
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source

    - name: setup-env
      runAfter: [fetch-source]
      taskRef:
        name: setup-env
      params:
        - name: elyaeval-package-spec
          value: $(params.elyaeval-package-spec)
      workspaces:
        - name: source
          workspace: source

    - name: run-suite
      runAfter: [setup-env]
      taskRef:
        name: run-suite
      params:
        - name: sut-url
          value: $(params.sut-url)
        - name: test-file
          value: $(params.test-file)
        - name: judge-model-name
          value: $(params.judge-model-name)
        - name: judge-model-base-url
          value: $(params.judge-model-base-url)
        - name: judge-model-format
          value: $(params.judge-model-format)
        - name: judge-api-key-secret-name
          value: $(params.judge-api-key-secret-name)
        - name: judge-api-key-secret-key
          value: $(params.judge-api-key-secret-key)
      workspaces:
        - name: source
          workspace: source

  finally:
    # finally tasks always run after the tasks above, regardless of
    # whether run-suite's own steps hit a non-zero exit — that's why
    # run-pytest above swallows pytest's exit code with `|| true`: the
    # actual pass/fail gate is check-results, not run-suite. A failing
    # finally task still fails the overall PipelineRun, so the gate is
    # preserved.
    #
    # NOTE: finally tasks run independently of each other (no implicit
    # ordering between check-results and publish-results below). That's
    # intentional here — publish-results only reads report files that
    # check-results doesn't touch — but if that ever changes, add an
    # explicit runAfter inside this finally block.
    - name: check-results
      taskRef:
        name: check-results
      workspaces:
        - name: source
          workspace: source
    - name: publish-results
      taskRef:
        name: publish-results
      params:
        - name: results-repo-url
          value: $(params.results-repo-url)
        - name: results-branch
          value: $(params.results-branch)
        - name: results-secret-name
          value: $(params.results-secret-name)
        - name: results-secret-key
          value: $(params.results-secret-key)
      workspaces:
        - name: source
          workspace: source