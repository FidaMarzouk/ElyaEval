apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: elyaeval-rag-recipe
spec:
  params:
    - name: repo-url
      type: string
      description: Repo containing the generated elyaeval test suite
    - name: revision
      type: string
      description: Git ref (branch, tag, or SHA) to check out from repo-url
    - name: elyaeval-package-spec
      type: string
      default: "git+https://github.com/FidaMarzouk/ElyaEval.git@eval"
      description: >-
        pip-installable spec for the elyaeval framework itself (not the SUT).
        This is the one deliberately hardcoded default in the whole recipe —
        every project runs the same framework code, so it's pinned centrally
        here and ONLY here. Override per-run if you need to test against a
        different framework tag/branch.
    - name: sut-url
      type: string
      description: Base URL of the SUT's /query endpoint, reachable from inside the cluster
    - name: test-file
      type: string
      description: >-
        Path (relative to the repo root) of the generated elyaeval test
        file to run — output of `elyaeval init --task-type ...` in the SUT
        repo. Use the rag_qa filename for that task type; pass a different
        value here once other task types (agentic, classifier, ...) get
        their own PipelineRuns — no change needed elsewhere in this recipe.
    - name: judge-model-name
      type: string
      description: "Model identifier for DeepEval's judge, e.g. openai/gpt-oss-120b or llama3.1"
    - name: judge-model-base-url
      type: string
      description: "OpenAI-compatible base URL for the judge model"
    - name: judge-model-format
      type: string
      description: "Response format for the judge model, e.g. json"
    - name: judge-api-key-secret-name
      type: string
      description: "Name of the k8s Secret holding the judge model API key"
    - name: judge-api-key-secret-key
      type: string
      description: "Key within the judge API key Secret's data"
    - name: nexus-base-url
      type: string
      default: "http://host.docker.internal:8081/repository/eval-results"
      description: >-
        Base URL of the Nexus raw hosted repo. Like elyaeval-package-spec
        above, this is a legitimate shared default — one Nexus instance
        serves every project — override only for a different Nexus
        environment.
    - name: nexus-project
      type: string
      description: "Subfolder / project namespace under the raw repo, e.g. project-x — one per SUT/team for access isolation"
    - name: nexus-secret-name
      type: string
      description: "Name of the k8s Secret holding Nexus credentials"
    - name: nexus-user-secret-key
      type: string
      description: "Key within the Nexus Secret's data holding the username"
    - name: nexus-token-secret-key
      type: string
      description: "Key within the Nexus Secret's data holding the token"
  workspaces:
    - name: source
  tasks:
    - name: fetch-source
      taskRef:
        name: fetch-source
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source

    - name: setup-env
      runAfter: [fetch-source]
      taskRef:
        name: setup-env
      params:
        - name: elyaeval-package-spec
          value: $(params.elyaeval-package-spec)
      workspaces:
        - name: source
          workspace: source

    - name: run-suite
      runAfter: [setup-env]
      taskRef:
        name: run-suite
      params:
        - name: sut-url
          value: $(params.sut-url)
        - name: test-file
          value: $(params.test-file)
        - name: judge-model-name
          value: $(params.judge-model-name)
        - name: judge-model-base-url
          value: $(params.judge-model-base-url)
        - name: judge-model-format
          value: $(params.judge-model-format)
        - name: judge-api-key-secret-name
          value: $(params.judge-api-key-secret-name)
        - name: judge-api-key-secret-key
          value: $(params.judge-api-key-secret-key)
      workspaces:
        - name: source
          workspace: source

  finally:
      #
      # NOTE: finally tasks run independently of each other (no implicit
      # ordering between check-results and report-results below). That's
      # intentional here — report-results only reads report files that
      # check-results doesn't touch 
      - name: check-results
        taskRef:
          name: check-results
        workspaces:
          - name: source
            workspace: source
      - name: report-results
        taskRef:
          name: report-results
        params:
          - name: nexus-base-url
            value: $(params.nexus-base-url)
          - name: nexus-project
            value: $(params.nexus-project)
          - name: nexus-secret-name
            value: $(params.nexus-secret-name)
          - name: nexus-user-secret-key
            value: $(params.nexus-user-secret-key)
          - name: nexus-token-secret-key
            value: $(params.nexus-token-secret-key)
          - name: run-id
            value: $(context.pipelineRun.name)
        workspaces:
          - name: source
            workspace: source